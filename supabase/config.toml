# ============================================================================
# Joy PeopleHR (WorkforceOS) — Supabase CLI Enterprise Configuration
# Canonical Project Reference: ysiajemrqakfngasehhi
# ============================================================================

# The project ID of your Supabase project.
project_id = "ysiajemrqakfngasehhi"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a view, table, or stored procedure.
max_rows = 5000

[db]
# Port to use for the local database URL.
port = 54322
# Port to use for the local shadow database.
shadow_port = 54320
# Major version of Postgres to use.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Pool mode to use. Supported values are "transaction" or "session".
pool_mode = "transaction"
# Default pool size for the connection pooler.
default_pool_size = 20
# Maximum client connections for the connection pooler.
max_client_conn = 100

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL for Supabase Studio.
api_url = "http://127.0.0.1"

# Email testing server.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Port to use for the SMTP server.
smtp_port = 54325
# Port to use for the POP3 server.
pop3_port = 54326

[storage]
enabled = true
# The maximum file size allowed (e.g. "50MiB", "100MiB").
file_size_limit = "50MiB"

[storage.buckets.employee-avatars]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.employee-documents]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg"]

[storage.buckets.payslips]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.company-assets]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing email verification links.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = [
  "https://joypeoplehr.com",
  "https://www.joypeoplehr.com",
  "https://app.joypeoplehr.com",
  "https://joypeoplehr.in",
  "https://app.joypeoplehr.in",
  "http://localhost:3000/**",
  "http://localhost:5173/**",
  "capacitor://localhost/**",
  "ionic://localhost/**"
]
# How long tokens are valid for in seconds. Defaults to 3600 (1 hour).
jwt_expiry = 3600
# If disabled, new users will not be allowed to sign up via the public API.
enable_signup = false
# Minimum time in seconds between password reset requests.
password_min_frequency = 60

[auth.password_security]
enable_leaked_password_protection = true

[auth.email]
# Allow/disallow new user signups via email.
enable_signup = false
# If enabled, a confirmation will be sent to the new email address before updating.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false

[auth.rate_limit]
# Number of emails that can be sent per hour per IP.
email_sent = 300
# Number of token verification attempts allowed per hour per IP.
token_verifications = 300
# Number of anonymous sign ins allowed per hour per IP.
anonymous_users = 30
# Number of sign ins allowed per hour per IP.
sign_ins = 300
# Number of sign ups allowed per hour per IP.
sign_ups = 60

[edge_runtime]
enabled = true
# Port to use for the local Edge Runtime server.
port = 54326
# Port to use for the Edge Runtime inspector.
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328

# Function specific configuration
[functions.employee-auth-provisioner]
verify_jwt = true

[functions.biometric-punch-ingestion]
verify_jwt = false

[functions.security-engine]
verify_jwt = true

[functions.automated-cron-dispatcher]
verify_jwt = false
