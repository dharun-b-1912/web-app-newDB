name: "JOY PeopleHR — Quality Gates & PR CI"

on:
  pull_request:
    branches: [ main, develop, qa, staging ]
  push:
    branches: [ develop ]

jobs:
  web-quality-gates:
    name: "Web App Quality Gates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Master Attendance & Backend Tests
        run: npx vitest run src/services/__tests__/masterAttendanceEngine.test.ts

      - name: Build Web Bundle Verification
        run: npm run build

  flutter-quality-gates:
    name: "Flutter Mobile Quality Gates"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flutter_app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Flutter Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

      - name: Verify Release APK Build
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=qa \
            --dart-define=APP_VERSION=1.0.3 \
            --dart-define=APP_BUILD_CODE=8
