  <!-- Subdomain Privacy & Domain Separation Routing Guard -->
  <script>
    (function () {
      var hostname = (window.location.hostname || '').toLowerCase();
      var pathname = (window.location.pathname || '/').toLowerCase();
      
      // 1. If on app subdomain or any private tenant subdomain, enforce NOINDEX immediately
      var isAppDomain = hostname.indexOf('app.') === 0 || 
                        (hostname !== 'joypeoplehr.com' && hostname !== 'www.joypeoplehr.com' && hostname !== 'localhost' && !/^(\d+\.){3}\d+$/.test(hostname));
      
      if (isAppDomain) {
        var metaRobots = document.querySelector('meta[name="robots"]');
        if (!metaRobots) {
          metaRobots = document.createElement('meta');
          metaRobots.setAttribute('name', 'robots');
          document.head.appendChild(metaRobots);
        }
        metaRobots.setAttribute('content', 'noindex, nofollow, noarchive');
        
        var metaGoogle = document.querySelector('meta[name="googlebot"]');
        if (!metaGoogle) {
          metaGoogle = document.createElement('meta');
          metaGoogle.setAttribute('name', 'googlebot');
          document.head.appendChild(metaGoogle);
        }
        metaGoogle.setAttribute('content', 'noindex, nofollow, noarchive');
      }

      // 2. Domain separation:
      // If user is on joypeoplehr.com root landing domain:
      if (hostname === 'joypeoplehr.com' || hostname === 'www.joypeoplehr.com') {
        var appPaths = [
          '/admin', '/people', '/employees', '/attendance', '/payroll',
          '/vendor', '/vendors', '/dashboard', '/workforce', '/workspace',
          '/profile', '/organization', '/departments', '/designations',
          '/locations', '/documents', '/assets', '/onboarding', '/offboarding',
          '/recruitment', '/talent', '/performance', '/lms', '/client-billing',
          '/platform', '/superadmin', '/login', '/ess', '/tl', '/auth'
        ];
        var isAppRoute = appPaths.some(function (p) {
          return pathname === p || pathname.indexOf(p + '/') === 0;
        });

        if (isAppRoute) {
          // Immediately redirect to app.joypeoplehr.com with full path and params preserved
          window.location.replace('https://app.joypeoplehr.com' + window.location.pathname + window.location.search + window.location.hash);
        } else {
          // If accessing joypeoplehr.com on any non-app route, strictly redirect to the landing page
          window.location.replace('/launch.html');
        }
      }
    })();
  </script>

  <script>
    (function () {
      var currentPct = 18;
      var targetPct = 18;
      var animId = null;
      var isExiting = false;

      function updateUI(pct, msg, detail) {
        targetPct = Math.max(targetPct, Math.min(100, pct));
        var msgEl = document.getElementById('joy-boot-msg');
        var detailEl = document.getElementById('joy-boot-detail');
        if (msg && msgEl) msgEl.textContent = msg;
        if (detail && detailEl) detailEl.textContent = detail;

        if (!animId) {
          animId = requestAnimationFrame(step);
        }
      }

      function step() {
        if (currentPct < targetPct) {
          currentPct += Math.max(1, (targetPct - currentPct) * 0.25);
          if (currentPct > targetPct) currentPct = targetPct;
        }
        var bar = document.getElementById('joy-boot-bar');
        var pctEl = document.getElementById('joy-boot-pct');
        var round = Math.round(currentPct);
        if (bar) bar.style.width = round + '%';
        if (pctEl) pctEl.textContent = round + '%';

        if (currentPct < targetPct) {
          animId = requestAnimationFrame(step);
        } else {
          animId = null;
          if (currentPct >= 100 && !isExiting) {
            isExiting = true;
            setTimeout(dismiss, 120);
          }
        }
      }

      function dismiss() {
        var loader = document.getElementById('initial-page-loader');
        if (loader) {
          loader.classList.add('joy-boot-exit');
          setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 400);
        }
      }

      // Expose globally for lifecycle hooks
      window.__joyBootStep = function (pct, msg, detail) {
        updateUI(pct, msg, detail);
      };

      window.__joyBootDismiss = function () {
        updateUI(100, 'Workspace Ready', 'Launching...');
      };

      // Progressively track runtime bootstrap while chunks load
      setTimeout(function () { updateUI(32, 'Loading Core Modules...', 'Compiling workforce modules'); }, 80);
      setTimeout(function () { updateUI(52, 'Verifying Credentials...', 'Reading session tokens'); }, 200);

      // Failsafe timer: Guaranteed dismissal within 3.5s so user is never blocked
      setTimeout(function () {
        if (!isExiting) window.__joyBootDismiss();
      }, 3500);
    })();
  </script>
  <script>
    window.addEventListener('vite:preloadError', function () {
      console.warn('[Vite] Dynamic chunk out of date after deployment. Reloading...');
      window.location.reload();
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
