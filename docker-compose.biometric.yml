version: '3.8'

services:
  joy-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: joy_peoplehr_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env

  joy-biometric-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: joy_biometric_gateway
    restart: always
    network_mode: host
    ports:
      - "11108:11108"
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=11108
      - ADMS_PORT=8080
      - COMM_KEY=123456
      - TENANT_ID=org-joy-01
    volumes:
      - ./scripts/data:/app/scripts/data
